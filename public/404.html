<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Wrapped</title>
    <!--
      GitHub Pages 404 → SPA redirect.

      GitHub Pages serves this file for every URL that doesn't map to a real
      file. Since the app uses hash-based routing (#/wrapped) there are no
      real sub-paths — any request for a non-existent path (e.g. a browser
      refresh on a shared link) just needs to land back at the app root and
      let the hash router take over.

      Strategy: grab the full original URL, convert any path segment after
      the repo base into a hash fragment, then redirect. This preserves deep
      links shared without a hash (e.g. /whatsapp-wrapped/wrapped → /#/wrapped).
    -->
    <script>
      (function () {
        var BASE = '/whatsapp-wrapped';
        var loc  = window.location;

        // Strip the base prefix to get the sub-path (e.g. "/wrapped" or "")
        var sub = loc.pathname.replace(BASE, '').replace(/^\//, '');

        // Build the redirect: always land on the base, carrying the sub-path
        // as a hash fragment so App.jsx's hashchange listener picks it up.
        var hash = sub ? '#/' + sub : '';
        var dest = loc.protocol + '//' + loc.hostname +
                   (loc.port ? ':' + loc.port : '') +
                   BASE + '/' + hash + loc.search;

        window.location.replace(dest);
      })();
    </script>
  </head>
  <body></body>
</html>
