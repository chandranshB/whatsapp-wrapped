<!doctype html>
<html lang="en" data-theme="whatsapp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WhatsApp Export Viewer</title>
    <meta name="description" content="Import and view your exported WhatsApp chats beautifully with multiple themes including WhatsApp and iMessage." />
    <meta name="theme-color" content="#111B21" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <!-- og:image must be an absolute URL — crawlers do not resolve relative paths.    -->
    <!-- The image lives in public/assets/ so Vite copies it verbatim to dist/assets/ -->
    <!-- and it is served at the path below on GitHub Pages.                           -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chandranshb.github.io/WhatsApp-Importer/" />
    <meta property="og:title" content="WhatsApp Wrapped — Relive Your Chats" />
    <meta property="og:description" content="Unwrap your WhatsApp story! Relive your year in chats, discover your top emojis, and uncover the hidden stats of your conversations." />
    <meta property="og:image" content="https://chandranshb.github.io/WhatsApp-Importer/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:site_name" content="WhatsApp Export Viewer" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chandranshb.github.io/WhatsApp-Importer/" />
    <meta name="twitter:title" content="WhatsApp Wrapped — Relive Your Chats" />
    <meta name="twitter:description" content="Unwrap your WhatsApp story! Relive your year in chats, discover your top emojis, and uncover the hidden stats of your conversations." />
    <meta name="twitter:image" content="https://chandranshb.github.io/WhatsApp-Importer/assets/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
